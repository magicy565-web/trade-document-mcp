[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-document-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29,<2","pydantic>=2.11,<3","openpyxl>=3.1,<4","reportlab>=4.4,<5","pypdf>=6,<7","cryptography>=42","Pillow>=10","defusedxml>=0.7"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
trade-doc-mcp = "trade_document.server:main"
trade-doc-finance = "trade_document.finance:main"
trade-doc-review = "trade_document.review:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
