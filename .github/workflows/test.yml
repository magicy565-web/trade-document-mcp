name: Trade document checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e '.[test]'
      - run: python -m pytest -q
      - run: python tools/evaluate.py
      - run: python tools/demo.py /tmp/trade-doc-v01
